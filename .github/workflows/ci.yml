name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  setup:
    uses: ./.github/workflows/setup.yml

  test:
    needs: setup
    runs-on: ubuntu-latest
    name: Test Suite

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node_modules

      - name: Restore node_modules permissions
        run: |
          npm rebuild --ignore-scripts
          chmod -R +x node_modules/.bin

      - name: Run tests
        run: npm test

  lint:
    needs: setup
    runs-on: ubuntu-latest
    name: Code Quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node_modules

      - name: Restore node_modules permissions
        run: |
          npm rebuild --ignore-scripts
          chmod -R +x node_modules/.bin

      - name: Run ESLint
        run: npm run lint

  build:
    needs: [setup, test, lint]
    runs-on: ubuntu-latest
    name: Build Application

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download node_modules
        uses: actions/download-artifact@v4
        with:
          name: node_modules

      - name: Restore node_modules permissions
        run: |
          npm rebuild --ignore-scripts
          chmod -R +x node_modules/.bin

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 5
