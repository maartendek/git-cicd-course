name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
    install:
    uses: ./.github/workflows/setup.yml

  test:
    needs: install
    runs-on: ubuntu-latest
    name: Test Suite

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download node_modules
        uses: actions/download-artifact@v4.6.2
        with:
          name: node_modules
      - name: Run tests
        run: npm test

  lint:
    needs: install
    runs-on: ubuntu-latest
    name: Code Quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download node_modules
        uses: actions/download-artifact@v4.6.2
        with:
          name: node_modules

      - name: Run ESLint
        run: npm run lint

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    name: Build Application


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download node_modules
        uses: actions/download-artifact@v4.6.2
        with:
          name: node_modules
          
      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: build-${{ github.sha }}
          path: dist/
          retention-days: 5
