name: Setup

on:
  workflow_call:
    outputs:
      node-version:
        description: "Node version used"
        value: ${{ jobs.setup.outputs.node-version }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.node.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
        run: echo "version=18" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Upload node_modules
        uses: actions/upload-artifact@v4.6.2
        with:
          name: node_modules
          path: node_modules/
          retention-days: 1
